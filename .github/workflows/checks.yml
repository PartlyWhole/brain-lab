name: Checks

on:
  pull_request:
  push:
    branches-ignore: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Semantic and unit tests
        run: npm run test

      - name: Build for a project subpath
        # Building with a non-root base is the case that breaks in practice, so
        # that is the one the checks build.
        run: npm run build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/

      - name: Browser journeys
        run: |
          npx playwright install --with-deps chromium
          npm run test:browser
        env:
          VITE_BASE: /${{ github.event.repository.name }}/

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
