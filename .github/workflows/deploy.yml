# Publishes the site to GitHub Pages.
#
# The base path is derived from the repository name, so this works unchanged
# for a project site at https://OWNER.github.io/REPOSITORY/. For a user or
# organisation site (https://OWNER.github.io/), set BASE_PATH to "/" in the
# repository variables.
#
# Nothing here invents an owner or repository: both come from the repository
# this workflow runs in.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time, and in-progress deployments are allowed to finish
# so a half-published site is never left behind.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Semantic and unit tests
        run: npm run test

      - name: Build
        run: npm run build
        env:
          VITE_BASE: ${{ vars.BASE_PATH || format('/{0}/', github.event.repository.name) }}
          GITHUB_SHA: ${{ github.sha }}

      - name: Browser journeys against the production build
        run: |
          npx playwright install --with-deps chromium
          npm run test:browser
        env:
          VITE_BASE: ${{ vars.BASE_PATH || format('/{0}/', github.event.repository.name) }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

      - name: Smoke test the published site
        # Checks the deployed URL itself, including a lesson deep link and the
        # self-hosted runtime, so a green deploy means the site actually serves.
        run: |
          set -euo pipefail
          url="${{ steps.deployment.outputs.page_url }}"
          echo "Checking $url"
          curl -fsS --retry 5 --retry-delay 5 --retry-all-errors "$url" > /dev/null
          curl -fsS "${url}runtime/runtime-version.json" > /dev/null
          curl -fsS -o /dev/null -w '%{content_type}\n' \
            "${url}runtime/pyodide/pyodide.asm.wasm" | grep -q 'application/wasm'
          echo "Published site responds, runtime assets are served with the right type."
